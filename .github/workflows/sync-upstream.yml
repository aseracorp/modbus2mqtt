name: "Daily sync with upstream"

on:
  schedule:
    # Once a day at 04:17 UTC — random minute to reduce GitHub cron congestion
    - cron: "17 4 * * *"
  workflow_dispatch: # allow manual runs

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    name: "Merge upstream/main into fork"
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: main
      SYNC_BRANCH: sync-upstream

    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/modbus2mqtt/modbus2mqtt.git
          git fetch upstream main --tags

      - name: Check for upstream changes
        id: changes
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Fork is $BEHIND commit(s) behind upstream/main"

      # Merge upstream into a non-protected sync branch. The "protect branch"
      # ruleset blocks direct pushes to main, so the merge lands via PR.
      - name: Merge upstream/main
        if: steps.changes.outputs.behind != '0'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${{ env.SYNC_BRANCH }}"

          # Merge upstream. On conflict, resolve deterministically:
          #   - add/add: keep OUR version for .github/workflows/* (so our sync
          #     & CI tooling survives) and for files we already track;
          #     otherwise take THEIRS (upstream's new content, e.g. specs).
          #   - rename/delete + modify/delete: take THEIRS (upstream moved/
          #     rewrote the file; keeping the old location would resurrect
          #     deleted code).
          # Then commit. This makes the merge always land; CI then decides
          # whether the result is buildable.
          if ! git merge upstream/main --no-edit --no-ff \
               -m "chore: merge upstream/main (${{ steps.changes.outputs.behind }} new commits)"; then
            echo "Merge had conflicts — resolving deterministically."

            # resolve all unmerged paths to a definite version
            unmerged=$(git diff --name-only --diff-filter=U)
            for f in $unmerged; do
              case "$f" in
                .github/workflows/*)
                  # keep our CI/sync workflows (theirs exists too, but our
                  # auto-merge & sync logic must survive)
                  git checkout --ours -- "$f" 2>/dev/null || git rm -f -- "$f" ;;
                *)
                  git checkout --theirs -- "$f" 2>/dev/null || git rm -f -- "$f" ;;
              esac
            done

            # drop any other (rename/delete) left-overs generically
            git add -A
            git commit --no-edit \
              -m "chore: merge upstream/main (${{ steps.changes.outputs.behind }} new commits)"
          fi

      # Land the merge: prefer an org-admin bot token (bypasses the ruleset,
      # same pattern as openwrt-packages/version-check.yml). If that secret is
      # not configured, fall back to a PR (ruleset requires 0 approvals).
      - name: Land upstream merge
        if: steps.changes.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BOT_TOKEN: ${{ secrets.GH_BOT_TOKEN }}
        run: |
          set -e

          # Option A: direct push with the org-admin bot token (bypasses the
          # "protect branch" ruleset). Only runs if the secret exists.
          if [ -n "${GH_BOT_TOKEN}" ]; then
            echo "::group::Direct push with GH_BOT_TOKEN"
            git config --unset-all "http.https://github.com/.extraheader" || true
            git remote set-url origin "https://x-access-token:${GH_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            n=0
            while :; do
              if git push origin "${{ env.SYNC_BRANCH }}:${{ env.TARGET_BRANCH }}"; then
                echo "Direct push to ${{ env.TARGET_BRANCH }} succeeded with bot token."
                echo "::endgroup::"
                exit 0
              fi
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "ERROR: could not push after 5 attempts" >&2
                echo "::endgroup::"
                exit 1
              fi
              echo "push rejected, rebasing and retrying ($n/5)"
              git pull --rebase origin "${{ env.TARGET_BRANCH }}"
            done
          fi

          # Option B: PR flow with GITHUB_TOKEN.
          echo "::group::PR flow"
          git push --force-with-lease origin "${{ env.SYNC_BRANCH }}"

          EXISTING=$(gh pr list --head "${{ env.SYNC_BRANCH }}" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          TITLE="chore: sync with upstream/main (${{ steps.changes.outputs.behind }} new commits)"
          BODY="Automated daily sync from the upstream check. Merge to apply the latest upstream commits."
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #${EXISTING} already open — updating it."
            gh pr edit "$EXISTING" --title "$TITLE" --body "$BODY" >/dev/null || true
            PR_NUMBER="$EXISTING"
          else
            PR_NUMBER=$(gh pr create --base "${{ env.TARGET_BRANCH }}" --head "${{ env.SYNC_BRANCH }}" --title "$TITLE" --body "$BODY" | grep -oE '[0-9]+$' || true)
            echo "Opened PR #${PR_NUMBER:-unknown}"
          fi

          if [ -n "$PR_NUMBER" ]; then
            echo "Merging PR #${PR_NUMBER} (ruleset allows 0-approval merges)."
            if gh pr merge "$PR_NUMBER" --merge --delete-branch=false; then
              echo "Sync PR #${PR_NUMBER} merged."
            else
              echo "::warning::Auto-merge of sync PR #${PR_NUMBER} failed (ruleset may require a human approval)."
              echo "::warning::PR #${PR_NUMBER} is open and ready for review — fork is otherwise in sync."
            fi
          fi
          echo "::endgroup::"

      - name: Nothing to do
        if: steps.changes.outputs.behind == '0'
        run: echo "Already up to date with upstream."