name: "On pull request: Enable Auto-Merge"

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  auto-merge:
    name: Enable auto-merge (squash)
    runs-on: ubuntu-latest
    # Only for trusted contributors (not bots, not external)
    if: >-
      ${{ github.actor != 'github-actions[bot]'
      && (github.event.pull_request.head.repo.full_name == github.repository
      || github.actor == 'volkmarnissen') }}
    steps:
      - uses: actions/checkout@v5
      # GITHUB_TOKEN is scoped to this repo and always available (secrets.PAT was
      # invalid/expired, causing the auto-merge to fail). contents+PR write perms
      # are enough to enable auto-merge.
      #
      # IMPORTANT: commits authored by GITHUB_TOKEN do NOT trigger "push"
      # workflows (GitHub anti-recursion), so after an auto-merge the
      # "Create and publish a Docker image" workflow would never fire. We
      # therefore poll until the PR is merged and then explicitly dispatch the
      # Docker workflow on main (workflow_dispatch IS allowed for GITHUB_TOKEN).
      - name: Enable auto-merge
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for merge then dispatch Docker image build
        run: |
          set -e
          # Wait (up to ~5 min) for auto-merge to complete.
          # NOTE: only poll on --json state ("MERGED"); some gh versions don't
          # know the "merged" json field and error out.
          for i in $(seq 1 60); do
            state=$(gh pr view ${{ github.event.pull_request.number }} --json state --jq .state)
            if echo "$state" | grep -qi 'MERGED'; then
              echo "PR merged after ${i}x5s"
              break
            fi
            sleep 5
          done
          final=$(gh pr view ${{ github.event.pull_request.number }} --json state --jq .state)
          echo "final state: $final"
          if echo "$final" | grep -qi 'MERGED'; then
            # Re-run the Docker publish on main (push trigger was skipped for
            # GITHUB_TOKEN-authored merges).
            gh workflow run docker-image.yml --ref main
            echo "dispatched docker-image.yml on main"
          else
            echo "PR not merged (state: $final) - skipping docker dispatch"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
